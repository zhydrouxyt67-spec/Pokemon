<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boosters">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#171033">
<title>Boosters Pokémon</title>
<style>
:root{--bg:#171033;--bg2:#251a52;--ink:#f7f1e3;--mute:#a79fc9;--gold:#ffc83d;--card:#fbf6e8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg));color:var(--ink);font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
nav{display:flex;gap:6px}
nav button{background:transparent;border:1px solid #4a3d85;color:var(--mute);padding:7px 12px;border-radius:999px;font:inherit;font-size:14px}
nav button.on{background:var(--gold);color:#2a1b00;border-color:var(--gold);font-weight:700}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:0 14px 40px}
.stats{color:var(--mute);font-size:14px;text-align:center;margin:2px 0 18px}
.stage{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.pack{width:190px;height:290px;border:0;border-radius:14px;cursor:pointer;position:relative;color:#fff;font:inherit;
background:linear-gradient(160deg,#ff4d5a 0%,#c1163f 45%,#5b0f4a 100%);box-shadow:0 18px 40px #0008,inset 0 0 0 3px #ffffff40;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.pack:active{transform:scale(.96)}
.pack::before,.pack::after{content:"";position:absolute;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#ffffff55 0 6px,transparent 6px 12px)}
.pack::before{top:0;border-radius:14px 14px 0 0}.pack::after{bottom:0;border-radius:0 0 14px 14px}
.pack .ball{width:84px;height:84px;border-radius:50%;background:linear-gradient(#fff 0 46%,#222 46% 54%,#fff 54%);border:5px solid #222;position:relative}
.pack .ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:#fff;border:5px solid #222}
.pack b{font-size:22px}.pack small{opacity:.85}
.shake{animation:sh .55s}
@keyframes sh{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.slot{width:calc(50% - 6px);max-width:230px;aspect-ratio:5/7;perspective:700px;cursor:pointer;border:0;padding:0;background:none}
.inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.slot.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,#2d2170 0 8px,#3a2c8c 8px 16px);border:3px solid var(--gold);display:grid;place-items:center;font-size:34px}
.front{transform:rotateY(180deg);container-type:inline-size;color:#1b1230;padding:3.5cqw;background:linear-gradient(135deg,#f7dc5a,#d9a31a 55%,#f3d24a);border-radius:4cqw}
.in{height:100%;border-radius:2cqw;padding:3cqw;display:flex;flex-direction:column;gap:2cqw;font-size:5cqw;border:.5cqw solid #0002}
.hd{display:flex;align-items:center;gap:1.5cqw}
.hd small{font-size:4.2cqw;font-weight:800;background:#1b123026;padding:.4cqw 2cqw;border-radius:1.5cqw;flex:0 0 auto}
.hd i.sp{flex:1}
.hd em{font-style:normal;font-weight:800;font-size:5.6cqw}
.nmx{font-weight:800;font-size:8.5cqw;line-height:1}
.art{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:1.5cqw;border:1.3cqw solid #d9a31a;box-shadow:inset 0 0 3cqw #0004}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.atk{display:flex;align-items:center;gap:2cqw}
.atk .c{flex:0 0 17cqw;display:flex;gap:.6cqw}
.atk .n{flex:1;font-weight:700;font-size:5.4cqw}
.atk .d{font-weight:800;font-size:6.4cqw}
.en{display:inline-grid;place-items:center;width:5.6cqw;height:5.6cqw;border-radius:50%;font-size:3.4cqw;font-style:normal;border:.4cqw solid #0003}
.ft{display:flex;justify-content:space-between;align-items:center;border-top:.4cqw solid #0003;padding-top:1.5cqw;font-size:3.8cqw}
.ft span{display:flex;align-items:center;gap:.8cqw}
.num{font-size:3.6cqw;text-align:right;opacity:.8}
.front.holo::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,#ff6ec455,#ffe86e55,#6effa955,#6ec8ff55,#c96eff55,#ff6ec455);mix-blend-mode:color-dodge;animation:spin 4s linear infinite;pointer-events:none}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.slot.r3 .front,.slot.r4 .front{box-shadow:0 0 22px 4px var(--gold)}
.slot.r4 .front{box-shadow:0 0 30px 8px #ff6ec4}
.new{position:absolute;top:-1px;right:-1px;background:#e5173f;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:0 8px 0 8px;z-index:2}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--gold);color:#2a1b00;border:0;border-radius:999px;font:inherit;font-weight:800;padding:13px 22px;font-size:16px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid #4a3d85}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grid .slot{cursor:default}
.grid .cnt{position:absolute;bottom:6px;right:8px;font-weight:800;font-size:12px;z-index:3;background:#1b1230;color:#fff;border-radius:999px;padding:1px 7px}
.lock .front{filter:grayscale(1) brightness(.35)}
.imp{position:absolute;top:8px;left:8px;z-index:5;font:inherit;font-size:12px;font-weight:700;background:var(--gold);color:#2a1b00;border:0;border-radius:999px;padding:6px 11px}
.imp.rm{left:auto;right:8px;background:#fff}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.shake,.holo::after{animation:none}}
</style>
</head>

<header>
<h1>Boosters Pokémon</h1>

<script>

["Rare","Arcanin|feu,Lokhlass|glace,Ronflex|normal,Alakazam|psy,Ectoplasma|spectre,Dracolosse|dragon,Raichu|elec,Scarabrute|insecte,Aérodactyl|roche,Mackogneur|combat"],

function shrink(im){var k=Math.min(1,400/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",.82)}

 if(i>4)i=4;var l=POOL[i].c;var c=l[Math.floor(Math.random()*l.length)];return{name:c.name,t:c.t,r:i}}

 if(r===4)s+='<circle cx="50" cy="52" r="46" fill="#fff" opacity=".5"/>';

 else s+=tail(['M68 74 Q92 76 88 52','M68 72 Q82 60 96 66','M68 76 Q88 90 94 72'][tl]);

var ATK={feu:["Flammèche","Lance-Flammes"],eau:["Pistolet à O","Hydrocanon"],plante:["Fouet Lianes","Lance-Soleil"],elec:["Éclair","Tonnerre"],psy:["Choc Mental","Psyko"],spectre:["Léchouille","Ombre Portée"],normal:["Charge","Plaquage"],vol:["Picpic","Cru-Ailes"],insecte:["Piqûre","Double Dard"],poison:["Dard-Venin","Détricanon"],sol:["Tunnel","Séisme"],roche:["Jet-Pierres","Éboulement"],dragon:["Draco-Griffe","Dracométéore"],combat:["Poing-Karaté","Close Combat"],glace:["Poudreuse","Blizzard"]};
var WK={feu:"eau",eau:"elec",plante:"feu",elec:"sol",psy:"spectre",spectre:"spectre",normal:"combat",vol:"elec",insecte:"feu",poison:"psy",sol:"eau",roche:"eau",dragon:"glace",combat:"psy",glace:"feu"};

function cardHTML(c,cls,extra){var T=TYPES[c.t],a=ATK[c.t],r=c.r,idx=all.map(function(x){return x.name}).indexOf(c.name)+1;
 var num=('00'+idx).slice(-3)+'/'+all.length;

var G=document.getElementById("game"),C=document.getElementById("coll"),ST=document.getElementById("stats");
function stats(){var u=Object.keys(S.c).length;ST.textContent=S.o+" boosters ouverts · "+u+" / "+all.length+" cartes différentes"}
function home(){G.innerHTML='<button class="pack" id="pk" aria-label="Ouvrir un booster"><span class="ball"></span><b>Booster</b><small>Appuie pour ouvrir</small></button><div class="stats">Boosters illimités, aucune connexion nécessaire</div>';
 document.getElementById("pk").onclick=function(){var p=this;p.classList.add("shake");setTimeout(open,550)}}
var cur=[],flipped=0;
function open(){cur=[];for(var i=0;i<4;i++)cur.push(pick(0));cur.push(pick(2));
 cur.sort(function(a,b){return a.r-b.r});flipped=0;S.o++;
 var html='<div class="row">';
 cur.forEach(function(c,i){c.isNew=!S.c[c.name];S.c[c.name]=(S.c[c.name]||0)+1;
  html+='<button class="slot r'+c.r+'" data-i="'+i+'" aria-label="Carte face cachée"><div class="inner"><div class="face back">❓</div>'+cardHTML(c,'',c.isNew?'<span class="new">NOUVELLE</span>':'')+'</div></button>'});
 html+='</div><div class="btns"><button class="btn alt" id="all">Tout retourner</button><button class="btn hide" id="nx">Un autre booster</button></div>';
 G.innerHTML=html;save();stats();
 var slots=G.querySelectorAll(".slot");
 slots.forEach(function(s){s.onclick=function(){flip(s)}});
 document.getElementById("all").onclick=function(){slots.forEach(function(s,i){setTimeout(function(){flip(s)},i*250)})};
 document.getElementById("nx").onclick=home}
function flip(s){if(s.classList.contains("flip"))return;s.classList.add("flip");flipped++;
 if(flipped>=cur.length){document.getElementById("nx").classList.remove("hide");document.getElementById("all").classList.add("hide")}}
function collection(){var u=Object.keys(S.c).length,h='<div class="btns" style="margin-bottom:12px"><button class="btn" id="bulk">Importer plusieurs images</button></div><div class="stats">'+u+' / '+all.length+' cartes · nomme tes fichiers comme les cartes (Pikachu.png)</div><div class="grid">';
 all.slice().sort(function(a,b){return b.r-a.r}).forEach(function(c){var n=S.c[c.name]||0;
  h+='<div class="slot flip'+(n?'':' lock')+'" style="position:relative"><div class="inner">'+cardHTML(c)+(n?'<span class="cnt">x'+n+'</span>':'')+'</div><button class="imp" data-n="'+c.name+'">'+(IMG[c.name]?'Changer':'Image')+'</button>'+(IMG[c.name]?'<button class="imp rm" data-n="'+c.name+'">Retirer</button>':'')+'</div>'});
 C.innerHTML=h+'</div>';
 document.getElementById('bulk').onclick=bulkImg;
 C.querySelectorAll('.imp').forEach(function(b){b.onclick=function(){if(b.classList.contains('rm')){delete IMG[b.dataset.n];saveImg();collection()}else pickImg(b.dataset.n)}})}
function tab(t){var g=t==="g";G.classList.toggle("hide",!g);C.classList.toggle("hide",g);
 document.getElementById("tG").classList.toggle("on",g);document.getElementById("tC").classList.toggle("on",!g);if(!g)collection()}
document.getElementById("tG").onclick=function(){tab("g")};
document.getElementById("tC").onclick=function(){tab("c")};
stats();home();
try{if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}catch(e){}

</script>
</body>
</html>
